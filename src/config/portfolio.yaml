    ML / AI Engineer working across machine learning,
    data engineering, MLOps, and applied AI.

  # We will design the artistic ML/AI engineering introduction
  # later. For now this is only structural content.

# ============================================================
# About
# ============================================================

about:
  introduction:
    enabled: true
    title: "Introduction"
    text: >
      I am an ML / AI Engineer with hands-on experience across machine
      learning, data engineering, MLOps, and applied AI. My recent work
      focuses on building complete, practical systems rather than isolated
      models, including data pipelines, model development and evaluation,
      experiment tracking, testing, deployment, and API-based inference.
      I also have an academic background in machine learning, mathematical
      modeling, image processing, parallel algorithms, high-performance
      computing, and data analysis through graduate studies and research
      at ITMO University.

  engineering_focus:
    enabled: true
    title: "Engineering Focus"
    items:
      - "Machine Learning & Deep Learning"
      - "ML Engineering & MLOps"
      - "Data Engineering & ETL"
      - "Time Series Forecasting"
      - "NLP & Document AI"
      - "Model Serving & APIs"
      - "Data Analysis & Mathematical Modeling"
      - "Research & Applied Computing"

  approach:
    enabled: true
    title: "Approach"
    text: >
      I approach machine learning as an engineering discipline as well as
      a modeling problem. I value reproducible workflows, clean and modular
      code, automated testing, data validation, experiment tracking, and
      maintainable deployment pipelines. I prefer practical solutions that
      can be understood, tested, and maintained, while using more advanced
      methods when they provide a clear benefit. My academic and project
      experience also gives me an interest in understanding the mathematical
      and computational foundations behind the systems I build.
