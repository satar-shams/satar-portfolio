about:
  introduction:
    enabled: true
    title: "Введение"
    text: >
      Я инженер по машинному обучению и ИИ с практическим опытом
      в области машинного обучения, инженерии данных, MLOps
      и прикладного искусственного интеллекта. В своей недавней
      работе я сосредоточен на создании полноценных практических
      систем, а не отдельных моделей. Это включает разработку
      конвейеров обработки данных, создание и оценку моделей,
      отслеживание экспериментов, тестирование, развёртывание
      и предоставление моделей для инференса через API.
      Также у меня есть академический опыт в области машинного
      обучения, математического моделирования, обработки
      изображений, параллельных алгоритмов, высокопроизводительных
      вычислений и анализа данных, полученный в ходе обучения
      в магистратуре и исследовательской работы в Университете ИТМО.

  engineering_focus:
    enabled: true
    title: "Основные направления"
    items:
      - "Машинное обучение и глубокое обучение"
      - "ML Engineering и MLOps"
      - "Инженерия данных и ETL"
      - "Прогнозирование временных рядов"
      - "NLP и Document AI"
      - "Развёртывание моделей и API"
      - "Анализ данных и математическое моделирование"
      - "Исследования и прикладные вычисления"

  approach:
    enabled: true
    title: "Подход к работе"
    text: >
      Я рассматриваю машинное обучение не только как задачу
      моделирования, но и как инженерную дисциплину. Для меня
      важны воспроизводимые рабочие процессы, чистый и модульный
      код, автоматизированное тестирование, проверка качества
      данных, отслеживание экспериментов и удобные в сопровождении
      процессы развёртывания. Я отдаю предпочтение практическим
      решениям, которые можно понять, протестировать и поддерживать,
      используя более сложные методы тогда, когда они действительно
      дают заметное преимущество. Мой академический и проектный опыт
      также формирует интерес к математическим и вычислительным
      основам создаваемых мной систем.

