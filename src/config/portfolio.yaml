projects:
  # ==========================================================
  # PROJECT 1
  # ==========================================================

  - title: "LSTM Time Series Forecasting — End-to-End MLOps"
    year: 2026
    category: "ML / MLOps"
    slug: "lstm-time-series-forecasting"

    description: >
      End-to-end machine learning system for AAPL stock-price
      forecasting, covering chronological data splitting,
      leakage-safe preprocessing, stacked LSTM modeling,
      hyperparameter optimization, experiment tracking,
      model management, evaluation, API-based inference,
      containerization, automated testing, CI/CD, and cloud
      deployment.

    image: "lstm-time-series-forecasting-mlops.png"

    technologies:
      - "Python"
      - "TensorFlow"
      - "Keras"
      - "LSTM"
      - "MLflow"
      - "Optuna"
      - "FastAPI"
      - "Docker"
      - "GitHub Actions"

    links:
      - label: "GitHub"
        url: "https://github.com/satar-shams/lstm-time-series-mlops"

  # ==========================================================
  # PROJECT 2
  # ==========================================================

  - title: "Market Data Pipeline — ETL"
    year: 2026
    category: "Data Engineering"
    slug: "market-data-pipeline"

    description: >
      Production-oriented market data pipeline that acquires
      financial data from yfinance, validates and transforms
      the data, stores it in PostgreSQL using idempotent loading,
      and provides an API layer for querying the stored data.
      Apache Airflow is being integrated for pipeline scheduling
      and orchestration.

    image: "market-data-pipeline-etl.png"

    technologies:
      - "Python"
      - "yfinance"
      - "Pandas"
      - "PostgreSQL"
      - "SQLAlchemy"
      - "Apache Airflow"
      - "FastAPI"
      - "Docker"
      - "Pytest"

    links:
      - label: "GitHub"
        url: "https://github.com/satar-shams/market-data-pipeline"

  # ==========================================================
  # PROJECT 3
  # ==========================================================

  - title: "Intelligent Document Analysis"
    year: 2026
    category: "AI / Document Intelligence"
    slug: "intelligent-document-analysis"

    description: >
      Document intelligence pipeline for processing PDF and DOCX
      documents, including text extraction, document preprocessing,
      OCR for scanned documents, text processing, embeddings, and
      vector-database foundations for semantic search and document
      retrieval.

    image: "intelligent-document-analysis-document-ai.png"

    technologies:
      - "Python"
      - "LangChain"
      - "PyMuPDF"
      - "python-docx"
      - "Tesseract OCR"
      - "Sentence Transformers"
      - "ChromaDB"
      - "Pytest"

    links:
      - label: "GitHub"
        url: "https://github.com/satar-shams/intelligent-document-analysis"

  # ==========================================================
  # PROJECT 4
  # ==========================================================

  - title: "Retail Orders ETL Pipeline"
    year: 2024
    category: "Data Engineering"
    slug: "retail-orders-etl"

    description: >
      End-to-end ETL pipeline for processing retail order data
      from CSV files and loading validated results into PostgreSQL.
      The project includes separate extraction, transformation,
      and loading stages, data-quality checks, incremental and
      idempotent loading, structured logging, automated testing,
      credential management, and containerized execution.

    image: "retail-orders-etl-pipeline.png"

    technologies:
      - "Python"
      - "Pandas"
      - "PostgreSQL"
      - "SQLAlchemy"
      - "Docker"
      - "Pytest"
      - "HashiCorp Vault"

    links:
      - label: "GitHub"
        url: "https://github.com/satar-shams/etl-retail-data-pipeline"

  # ==========================================================
  # PROJECT 5
  # ==========================================================

  - title: "ML Inference API"
    year: 2025
    category: "ML Engineering"
    slug: "ml-inference-api"

    description: >
      Machine learning inference service built around a REST API
      for serving model predictions, with request and response
      validation, environment-based configuration, structured
      logging, automated testing, modular model handling, and
      Docker-based deployment.

    image: "ml-inference-api-fastapi.png"

    technologies:
      - "Python"
      - "FastAPI"
      - "Pydantic"
      - "Docker"
      - "Pytest"
      - "Structured Logging"

    links:
      - label: "GitHub"
        url: "https://github.com/satar-shams/ml-inference-api"

