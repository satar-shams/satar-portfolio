    technologies:
      - "Python"
      - "TensorFlow"
      - "LSTM"
      - "MLflow"
      - "Optuna"
      - "FastAPI"
      - "Docker"
      - "GitHub Actions"

    links:
      - label: "GitHub"
        url: "https://github.com/satar-shams/lstm-time-series-mlops"

  # ==========================================================
  # PROJECT 2
  # ==========================================================

  - title: "Market Data Pipeline"
    year: 2026
    category: "Data Engineering"
    slug: "market-data-pipeline"

    description: >
      Production-oriented market data pipeline for automated
      acquisition, processing, storage, and API access.

    image: "market-data-pipeline.png"

    technologies:
      - "Python"
      - "Apache Airflow"
      - "PostgreSQL"
      - "FastAPI"
      - "Docker"
      - "SQL"

    links:
      - label: "GitHub"
        url: "https://github.com/satar-shams/market-data-pipeline"

  # ==========================================================
  # PROJECT 3
  # ==========================================================

  - title: "Intelligent Document Analysis"
    year: 2026
    category: "AI / Document Intelligence"
    slug: "intelligent-document-analysis"

    description: >
      Document intelligence project focused on document ingestion,
      preprocessing, OCR, text processing, embeddings, and
      vector-search foundations.

    image: "intelligent-document-analysis.png"

    technologies:
      - "Python"
      - "LangChain"
      - "PyMuPDF"
      - "OCR"
      - "Sentence Transformers"
      - "ChromaDB"

    links:
      - label: "GitHub"
        url: "https://github.com/satar-shams/intelligent-document-analysis"

  # ==========================================================
  # PROJECT 4
  # ==========================================================

  - title: "Retail Orders ETL Pipeline"
    year: 2026
    category: "Data Engineering"
    slug: "retail-orders-etl"

    description: >
      End-to-end ETL pipeline for extracting, validating,
      transforming, and incrementally loading retail order data
      into PostgreSQL.

    image: "retail-orders-etl.png"

    technologies:
      - "Python"
      - "Pandas"
      - "PostgreSQL"
      - "SQLAlchemy"
      - "Docker"
      - "Pytest"
      - "HashiCorp Vault"

    links:
      - label: "GitHub"
